<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="220" fill="url(#goldGlow)" filter="url(#glow)" />
  <circle cx="1050" cy="450" r="260" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="315" r="300" fill="#8b5cf6" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Card Border -->
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="#0e1628" fill-opacity="0.8" stroke="#eab308" stroke-width="2" stroke-opacity="0.3" />

  <!-- Badges Top -->
  <g transform="translate(90, 100)">
    <rect width="170" height="32" rx="6" fill="#14532d" fill-opacity="0.8" stroke="#22c55e" stroke-width="1.5" />
    <text x="85" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#86efac" text-anchor="middle" letter-spacing="1">PROBABILIDADES OFICIALES</text>

    <rect x="185" width="140" height="32" rx="6" fill="#831843" fill-opacity="0.8" stroke="#ec4899" stroke-width="1.5" />
    <text x="255" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbcfe8" text-anchor="middle" letter-spacing="1">EVENTO CAZATESOROS</text>

    <rect x="340" width="130" height="32" rx="6" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.5" />
    <text x="405" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe" text-anchor="middle" letter-spacing="1">SEMANA 2 ACTIVA</text>
  </g>

  <!-- Title -->
  <text x="90" y="215" font-family="Impact, sans-serif" font-size="64" font-weight="bold" fill="url(#gold)" letter-spacing="2">
    FORTNITE TREASURE ODDS
  </text>
  <text x="90" y="265" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#94a3b8">
    Simulador Matemático y Calculadora Oficial de Cofres
  </text>

  <!-- Key stats cards -->
  <g transform="translate(90, 310)">
    <!-- Box 1 -->
    <rect width="320" height="150" rx="16" fill="#070c18" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Pirate Shop Access</text>
    <text x="24" y="90" font-family="Impact, sans-serif" font-size="36" fill="#fbbf24">1 en 137.500</text>
    <text x="24" y="122" font-family="system-ui, sans-serif" font-size="13" fill="#22c55e">Mediana 50%: 95.308 cofres</text>

    <!-- Box 2 -->
    <g transform="translate(345, 0)">
      <rect width="320" height="150" rx="16" fill="#070c18" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Bono Hora del Tesoro (x2)</text>
      <text x="24" y="90" font-family="Impact, sans-serif" font-size="36" fill="#38bdf8">1 en 68.750</text>
      <text x="24" y="122" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8">Mediana 50%: 47.654 cofres</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(690, 0)">
      <rect width="320" height="150" rx="16" fill="#070c18" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Simulador Monte Carlo</text>
      <text x="24" y="90" font-family="Impact, sans-serif" font-size="36" fill="#c084fc">Web Workers</text>
      <text x="24" y="122" font-family="system-ui, sans-serif" font-size="13" fill="#c084fc">100.000+ simulaciones</text>
    </g>
  </g>

  <!-- Footer branding -->
  <text x="90" y="525" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">
    Herramienta independiente de código abierto &middot; Sin backend ni registros &middot; Persistencia local
  </text>
  <text x="1110" y="525" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#eab308" text-anchor="end">
    github.com/CarlosCarballido/fortnite-treasure-odds
  </text>
</svg>
